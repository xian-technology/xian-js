name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish or backfill, for example v0.2.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      xian_contracting_repository: ${{ steps.resolve.outputs.xian_contracting_repository }}
      xian_contracting_ref: ${{ steps.resolve.outputs.xian_contracting_ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          path: xian-js
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Check out release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: xian-js-release-tools
          ref: ${{ github.sha }}

      - name: Resolve release tag commit
        id: release-tag
        working-directory: xian-js
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"

      - name: Resolve immutable release context
        id: resolve
        working-directory: xian-js
        env:
          RELEASE_REF_TYPE: tag
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          TRIGGER_SHA: ${{ steps.release-tag.outputs.commit_sha }}
        run: node ../xian-js-release-tools/scripts/release-context.mjs resolve

  build:
    needs: release-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: xian-js
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: xian-js
          ref: ${{ needs.release-context.outputs.source_sha }}

      - name: Check out pinned xian-contracting source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ needs.release-context.outputs.xian_contracting_repository }}
          ref: ${{ needs.release-context.outputs.xian_contracting_ref }}
          path: xian-contracting

      - name: Set up Rust 1.96.1
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.14.0 --locked
          fi
          wasm-pack --version

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: xian-js/package-lock.json

      - name: Verify pinned source and package context
        env:
          COMPONENT_CHECKOUT: ${{ github.workspace }}/xian-contracting
          EXPECTED_SOURCE_SHA: ${{ needs.release-context.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: node ./scripts/release-context.mjs verify-component

      - name: Install locked dependencies
        run: npm ci

      - name: Build shared compiler
        run: npm run build:compiler

      - name: Audit production dependencies
        run: npm audit --audit-level=critical --omit=dev

      - name: Validate workspace
        run: npm run validate

      - name: Pack published packages
        run: |
          mkdir -p release-dist
          npm pack --workspace @xian-tech/types --pack-destination release-dist
          npm pack --workspace @xian-tech/client --pack-destination release-dist
          npm pack --workspace @xian-tech/dex --pack-destination release-dist
          npm pack --workspace @xian-tech/provider --pack-destination release-dist
          npm pack --workspace @xian-tech/web-kit --pack-destination release-dist

      - name: Verify release artifact metadata
        env:
          ARTIFACT_DIRECTORY: release-dist
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: node ./scripts/release-context.mjs verify-artifacts

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: xian-js/release-dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - release-context
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      web_kit_published: ${{ steps.publish.outputs.web_kit_published }}
    environment:
      name: npm
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org

      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: release-dist

      - name: Publish packages to npm
        id: publish
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          shopt -s nullglob
          web_kit_published=true
          packages=(release-dist/*.tgz)
          if [ "${#packages[@]}" -ne 5 ]; then
            echo "Expected five npm artifacts, found ${#packages[@]}" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            metadata="$(
              tar -xOf "$package" package/package.json \
                | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const pkg = JSON.parse(input); console.log(pkg.name + "\t" + pkg.version); });'
            )"
            name="${metadata%%$'\t'*}"
            version="${metadata#*$'\t'}"
            case "${name}" in
              @xian-tech/types|@xian-tech/client|@xian-tech/dex|@xian-tech/provider|@xian-tech/web-kit) ;;
              *) echo "Unexpected package: ${name}" >&2; exit 1 ;;
            esac
            if [ "${version}" != "${EXPECTED_VERSION}" ]; then
              echo "${name} has version ${version}, expected ${EXPECTED_VERSION}" >&2
              exit 1
            fi

            if published_integrity="$(npm view "${name}@${version}" dist.integrity 2>/dev/null)"; then
              local_integrity="$(
                node - "$package" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const archive = fs.readFileSync(process.argv[2]);
          console.log(`sha512-${crypto.createHash("sha512").update(archive).digest("base64")}`);
          NODE
              )"
              if [ -z "${published_integrity}" ] || [ "${published_integrity}" != "${local_integrity}" ]; then
                echo "Published ${name}@${version} does not match the validated artifact" >&2
                exit 1
              fi
              echo "${name}@${version} already exists with matching integrity; skipping"
              continue
            fi

            publish_tag="latest"
            if [[ "${version}" == *"-"* ]]; then
              publish_tag="beta"
            fi
            if ! npm publish "./$package" --provenance --access public --tag "${publish_tag}"; then
              if [ "${name}" = "@xian-tech/web-kit" ]; then
                web_kit_published=false
                echo "::warning::${name}@${version} could not be published to npm; keeping it in the GitHub release artifacts"
                continue
              fi
              exit 1
            fi
          done

          echo "web_kit_published=${web_kit_published}" >> "${GITHUB_OUTPUT}"

  github-release:
    needs:
      - release-context
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: release-dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
          WEB_KIT_PUBLISHED: ${{ needs.publish.outputs.web_kit_published }}
        run: |
          release_flags=()
          release_notes=()
          if [[ "${RELEASE_TAG}" == *"-"* ]]; then
            release_flags+=(--prerelease)
          fi
          if [[ "${WEB_KIT_PUBLISHED}" != "true" ]]; then
            release_notes+=(
              --notes
              $'NPM publish status:\n\n- Published to npm: `@xian-tech/client`, `@xian-tech/dex`, `@xian-tech/provider`, and `@xian-tech/types`.\n- Attached as a validated release artifact: `@xian-tech/web-kit`. npm publish for this package is blocked by npm package trusted-publisher/token permissions.\n'
            )
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" release-dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "xian-js ${RELEASE_VERSION}" \
              --generate-notes \
              "${release_notes[@]}" \
              "${release_flags[@]}"
          fi
